[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xun-pos"
version = "1.1.0"
description = "Sistema de Punto de Venta rápido y ligero para Linux"
readme = "README.md"
requires-python = ">=3.7"
authors = [
    {name = "Daniel Hernández Arroyo", email = "teacherdhapps@users.noreply.github.com"},
]
license = {text = "MIT"}
keywords = ["pos", "punto-de-venta", "retail", "tkinter", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Retail",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]

dependencies = [
    "tkcalendar>=1.6.1",
    "reportlab>=4.0",
    "matplotlib>=3.0",
    "customtkinter>=6.0.0",
]

[project.scripts]
xun-pos = "login:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pos_gui*", "products_gui*", "reports_gui*", "settings_gui*", "store*", "database*", "config*", "security*", "scripts*", "thermal_printer*", "login*"]

[tool.setuptools.package-data]
"" = ["*.csv", "*.json", "*.png"]

[tool.setuptools.scripts]
xun-pos = "login:main"
